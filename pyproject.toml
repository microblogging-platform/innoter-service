[project]
name = "innoter-service"
version = "0.1.0"
description = ""
package-mode = false
authors = [
    {name = "Kyrylo Alieksieiev",email = "newkirilal@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "adrf (>=0.1.12,<0.2.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "aiomysql (>=0.3.2,<0.4.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "aio-celery (>=0.22.0,<0.23.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "django-cors-headers (>=4.0.0,<5.0.0)",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
]

[tool.pyright]
extraPaths = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
